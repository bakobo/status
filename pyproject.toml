[project]
name = "bakobo-status"
version = "0.1.0"
description = "Declare, update and close incidents on the Bakobo status page — incidents as files in git."
requires-python = ">=3.11"
# Deliberately empty. This tool must work when other things do not, and every dependency is a way
# for that to stop being true; the header format is hand-parsed rather than YAML for the same
# reason (see incidents.py).
dependencies = []

[project.scripts]
# `bakobo-status`, not `status`. Siblings whose name is distinctive ship the bare word (witness,
# imbu, merti); the one whose name is a generic English noun prefixes it, as bakobo/errors ships
# `bakobo-errors`. `status` is generic in exactly that way, and a binary called `status` on an
# operator's PATH says nothing about whose estate it reports on.
bakobo-status = "bakobo_status.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakobo_status"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bakobo_status"]

[tool.coverage.report]
# AGENTS.md requires 100% branch coverage of new code, and a threshold that is not enforced is a
# preference. Failing the run is what makes it a standard.
fail_under = 100
show_missing = true
