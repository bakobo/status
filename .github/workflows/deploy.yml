# Build the page and publish it to Cloudflare Pages.
#
# On every push to main, which means posting an incident republishes the page within a minute or
# two -- and that is the point. The page is a snapshot rather than a live view (site.py says so on
# the page itself), so freshness has to come from rebuilding at the moments freshness matters:
# when someone declares an incident, updates one, resolves one, or when the nightly rollup adds a
# day.
#
# THAT LAST ONE WAS FALSE FOR THE FIRST WEEK, and it failed the way this whole repository is built
# to notice: silently. GitHub does not start a workflow run from an event created with the
# automatic `GITHUB_TOKEN`, so the rollup's own `git push` -- authenticated with exactly that token
# -- was not a `push` event as far as this file was concerned. Two nightly rollups committed a day
# each and neither republished, so the page served a build from forty hours earlier while claiming
# in its own footer to be a snapshot rebuilt nightly. The rule has no exception worth relying on:
# `workflow_dispatch` and `repository_dispatch` fired with the same token are suppressed too, so
# the alternatives were an App token on the push (a credential, and an installation to maintain)
# or this -- a `workflow_run` trigger, which the rule does not cover and which needs no credential
# at all.
#
# Cloudflare **Pages**, not Workers, against Cloudflare's own advice that new projects should use
# Workers. A Workers Custom Domain requires an active Cloudflare zone and cannot attach to a
# hostname carrying an existing CNAME elsewhere, so status.bakobo.com on Workers would force
# bakobo.com's nameservers to Cloudflare -- the migration infra's @kur5pd refused on evidence.
# Pages serves a subdomain from external DNS. See infra @xxbjzkw5 for the full argument and the
# trigger for revisiting it.
#
# The deploy credential is scoped to `Cloudflare Pages: Edit` and nothing else. Verified rather
# than assumed: it reads Pages projects and is refused on account members. That matters because
# this repository is public, so the token lives in a public repository's secrets, and DNS is
# exactly what it must not be able to touch.

name: Deploy

on:
  push:
    branches: [main]
  # `workflows` matches the `name:` of the other workflow, not its filename. Renaming Rollup
  # without changing this line unwires the trigger and nothing anywhere reports it, which is the
  # second reason the dead-man's switch below is not optional.
  workflow_run:
    workflows: [Rollup]
    types: [completed]
  # NO SCHEDULE, deliberately, and it had one for a day. A claim about now goes stale on a clock,
  # so while the snapshot was baked into the HTML this workflow ran every fifteen minutes -- which
  # meant republishing an entire website to change a kilobyte of data, ninety-six times a day. The
  # data now lives in KV and the page fetches it from its own origin (functions/now.js), so this
  # runs when CONTENT changes and nothing else. See the Now workflow for what replaced the cron.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A build racing another build would publish whichever finished last rather than whichever is
  # newest -- and during an incident the newest is the one that matters.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Job level rather than step level, for the reason the rollup job records: a step's own `env:`
    # block is not in scope for that step's own `if:`, so a guard written there reads an empty
    # string either way and the switch is silently unwired.
    env:
      DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
    # `types: [completed]` fires on a failed rollup as well as a successful one, and a rollup that
    # failed committed nothing -- so there is nothing new to publish and the run would be noise on
    # a day someone is already reading an alert. Every other trigger passes unconditionally.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # NOT `github.event.workflow_run.head_sha`, which is the trap here. That is the commit
          # the ROLLUP ran on -- the state of main before the rollup pushed its day -- so building
          # from it would deploy the page without the day whose arrival triggered the build, and
          # the result would look exactly like the bug this trigger exists to fix. The branch head
          # is what has the day. Checking out `main` rather than a pinned sha also means a build
          # racing a newer push publishes the newer content, which is what the concurrency group
          # below already asks for.
          ref: main

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync --frozen

      # The one step here that touches a network, and the only one allowed to fail without failing
      # the deploy.
      #
      # It harvests each component's current state so the newest cell of the strip and the banner
      # have something to say about now. Without it both fall back to "we do not currently know",
      # which is honest and useless -- the page's whole job is the question "are you up", and until
      # this ran the answer came from the absence of an incident file rather than from a probe.
      #
      # `continue-on-error` is load-bearing and is what keeps the property the build was given at
      # the start: the page must still publish while the estate is on fire, because that is exactly
      # when someone is posting an incident. If Grafana is unreachable -- or is itself the thing
      # that is broken -- the snapshot is simply absent, the page renders today grey and says why,
      # and the incident still reaches readers. A hard failure here would take the status page down
      # for the same reason the status page exists.
      #
      # Timed out at three minutes because the client's own timeout is 60s per query and there are
      # seven components: a hung endpoint would otherwise hold the publish for seven minutes.
      - name: harvest what is true right now
        continue-on-error: true
        timeout-minutes: 3
        env:
          GRAFANA_PROM_URL: ${{ vars.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER: ${{ vars.GRAFANA_PROM_USER }}
          GRAFANA_PROM_TOKEN: ${{ secrets.GRAFANA_PROM_TOKEN }}
        run: uv run bakobo-status now

      # The build itself still reads files and reaches no network, deliberately.
      - name: build
        run: uv run bakobo-status build --out _site

      # Pages Functions have to sit inside the directory being deployed, so they are copied in
      # rather than built. Kept out of site.py: the page generator emits a page, and teaching it to
      # place JavaScript for a hosting product would tie the two together for no benefit.
      - name: bring the snapshot endpoint along
        run: |
          set -euo pipefail
          mkdir -p _site/functions
          cp functions/*.js _site/functions/
          echo "functions: $(ls _site/functions)"

      - name: the page is not empty
        run: |
          set -euo pipefail
          # A zero-byte or truncated index.html would deploy cleanly and serve a blank status page,
          # which is worse than serving a stale one. Cheapest possible guard against that.
          test -s _site/index.html
          grep -q "Bakobo status" _site/index.html
          echo "index.html is $(wc -c < _site/index.html) bytes"

      - name: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # `npx wrangler` rather than a marketplace action: the deploy is one command, and an action
        # here would be a third party with access to a token in a public repository's secrets.
        # Pinned by exact version so the tool cannot change under us between deploys.
        run: npx --yes wrangler@4.129.0 pages deploy _site --project-name=bakobo-status --branch=main

      # A DEAD-MAN'S SWITCH, for the reason the rollup has one and for one this job earned on its
      # own. The rollup's argument is ops.md §6's: monitoring for failure misses the case where the
      # job stopped running, which is the common case. This job proved the argument -- it did not
      # fail, it was never triggered, so there was no red run to notice and nothing in the Actions
      # tab looked wrong. The page went stale for forty hours and was caught by a person opening it
      # and reading the footer.
      #
      # Period wants to be a little over a day: the nightly rollup triggers a deploy every day even
      # when nobody pushes, so silence past that means the schedule -> rollup -> trigger -> publish
      # chain is broken somewhere. It was briefly an hour, tied to a fifteen-minute rebuild
      # schedule that no longer exists -- with the data in KV, this workflow is content-driven
      # again and an hourly guard would page on a quiet Sunday.
      #
      # Freshness of the STATUS is now guarded separately, by the Now workflow's own switch, which
      # is the right split: this one asks "is the site still being published", that one asks "is
      # anything still measuring". They fail independently and they mean different things.
      - name: tell the switch how it went
        if: always() && env.DEPLOY_HEALTHCHECK_URL != ''
        env:
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # `always()` so a failed publish pings /fail immediately rather than waiting out the
          # period, which would arrive hours later and be indistinguishable from never having run.
          if [ "$RESULT" = "success" ]; then endpoint="$DEPLOY_HEALTHCHECK_URL"; else endpoint="$DEPLOY_HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$RESULT $RUN_URL" "$endpoint"

      - name: warn if the switch is not wired
        if: always() && env.DEPLOY_HEALTHCHECK_URL == ''
        run: echo "::warning::DEPLOY_HEALTHCHECK_URL is unset, so nothing will notice if this workflow stops being triggered. The deploy still runs -- publishing beats guarding it -- but the failure it just recovered from would recur unobserved."
