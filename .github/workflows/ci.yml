# The suite, and the coverage floor that makes it a standard rather than a preference.
#
# No credentials and no network: bakobo-status writes files and talks to nothing, which is the
# property the tool exists for and is therefore the property CI should keep true. A job here that
# needed a secret would be evidence the tool had grown a dependency it should not have.
#
# Action versions are pinned by commit SHA rather than by tag, matching the other Bakobo repos: a
# tag is mutable and a workflow that trusts one is running whatever the tag points at today.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # --frozen so a resolution that drifted from uv.lock fails here rather than being silently
      # adopted, which is the same argument as tofu's -lockfile=readonly one repo over.
      - name: sync
        run: uv sync --frozen

      # fail_under = 100 lives in pyproject.toml, so this fails on a branch that drops coverage
      # without anyone having to read the number.
      - name: pytest
        run: uv run pytest --cov=bakobo_status --cov-report=term-missing

      # The CLI has to actually start. A package whose tests import it happily can still ship a
      # broken console script -- a bad entry point is invisible to pytest and obvious to the first
      # person who runs it, which during an outage is the worst possible time to find out.
      - name: the command runs
        run: uv run bakobo-status --help
