# Harvest the estate's current state and put it where the page can fetch it, without rebuilding
# the page.
#
# This job exists to undo a mistake. When the page first grew a claim about *now*, the snapshot was
# baked into the HTML, which meant a claim that goes stale on a clock could only be refreshed by
# republishing the whole site -- ninety-six Cloudflare deployments a day to change a kilobyte, a
# build system doing a database's job. Now the data goes to KV, the page fetches it from its own
# origin through a Pages Function, and deploys happen when CONTENT changes: an incident, a
# rolled-up day, a change to the code.
#
# Fifteen minutes matches the probe period exactly. The underlying truth does not change more often
# than that, so a tighter schedule buys nothing. The estate's cron host now keeps that cadence; see
# the note above `on:` for why Actions could not.
#
# Drift is tolerable here in a way it was not before. GitHub delays and drops scheduled workflows
# under load (rollup.yml says so at length), and while the snapshot was baked into the build a run
# landing twenty minutes late would push the page past its own forty-five-minute freshness gate and
# grey it out. With the data fetched at read time, a late run only means the reading is a little
# older, and the gate still catches a genuinely stopped harvest.
#
# A Cloudflare Worker on a cron trigger would remove this job entirely, and was the first choice.
# Two things stopped it: cron triggers were not firing at all for this account when probed on
# 2026-09-08, and the free plan allows 10ms of CPU per cron invocation -- enough to await seven
# Grafana round trips, since I/O is not CPU, but not obviously enough to parse and score their
# responses. Workers Paid at $5/month lifts the ceiling to 30 seconds and would make the swap
# worthwhile; nothing here would change except what writes the key.

name: Now

# NO SCHEDULE ANY MORE. bakobo/infra's prod/cron host runs this harvest every fifteen minutes on a
# systemd timer, and this workflow is kept only as the manual path for when that host is down.
#
# WHY IT MOVED, measured rather than felt. Over 2026-09-11..14 this `*/15` cron produced 26
# scheduled runs where roughly 370 were due -- about 7% -- with a median gap of 182 minutes and a
# worst of 399. Every one of those 26 gaps exceeded the page's own 45-minute freshness gate, so
# status.bakobo.com showed grey essentially continuously. That is independent of the healthcheck
# bug those runs were also hitting: the harvest and the KV write inside them succeeded, so the data
# was landing, just hours apart.
#
# The control is in this repository over the same days. rollup.yml's daily cron fired 4 times out
# of 4 WHILE FAILING EVERY TIME on an unrelated bug -- which rules out both backoff and
# credentials, and leaves frequency as the only variable. A slower cron is not a fix: 60 minutes
# would be dropped the same way and still lose to the gate.
#
# ONE WRITER, which is the other half of the reason. Both this workflow and the host write the same
# KV key, and neither can see the other's lock -- Cloudflare KV has no compare-and-swap, so a late
# Actions run could overwrite a newer host reading with an older one. flock does not help across
# two machines. Leaving `workflow_dispatch` is safe because a human choosing to run it knows why.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two harvests writing the same key would land in whichever order they finished, and the loser
  # would overwrite a newer reading with an older one. Serialise; do not cancel, because a run that
  # is nearly done is worth more than one that has just started.
  group: now
  cancel-in-progress: false

jobs:
  now:
    name: now
    runs-on: ubuntu-latest
    env:
      NOW_HEALTHCHECK_URL: ${{ secrets.NOW_HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same guard the rollup carries, and this workflow is why it exists: NOW_HEALTHCHECK_URL
      # held a value that was not a URL from the day it was added, so every ping died on
      # `curl: (3) URL rejected: No host part in the URL` and this switch never once worked. It
      # does not exit non-zero -- see rollup.yml for why a guard that stops the publish would do
      # more damage than the misconfiguration it reports.
      - name: the switch is a URL, or says why not
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$NOW_HEALTHCHECK_URL" ]; then
            echo "::warning::NOW_HEALTHCHECK_URL is unset. A stopped harvest greys the page for readers within 45 minutes, which is honest but tells nobody who can fix it. The check's period is fifteen minutes, matching the cron host's timer, with grace enough that one missed run is not an alarm."
          elif [ "${NOW_HEALTHCHECK_URL#https://}" = "$NOW_HEALTHCHECK_URL" ]; then
            echo "::error::NOW_HEALTHCHECK_URL is set but does not begin with https://, so every ping fails and this switch has never worked. A healthchecks.io ping address is the whole URL, https://hc-ping.com/<uuid>, not the uuid on its own."
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync --frozen

      # Writes now.json: the readings AND the verdicts rendered from them, composed by site.publish
      # so the page built from this file and the page refreshed from it cannot disagree.
      - name: harvest
        timeout-minutes: 3
        env:
          GRAFANA_PROM_URL: ${{ vars.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER: ${{ vars.GRAFANA_PROM_USER }}
          GRAFANA_PROM_TOKEN: ${{ secrets.GRAFANA_PROM_TOKEN }}
        run: uv run bakobo-status now

      # Read back before publishing, the same discipline the rollup uses: the harvest exits 0 when
      # every query succeeded and every one returned nothing, which is what a renamed metric looks
      # like. Publishing that would replace a good reading with a page-wide "status unknown".
      - name: at least one component was actually measured
        run: |
          set -euo pipefail
          if ! grep -q '"as_of": "' now.json; then
            echo "::error::The harvest exited cleanly but no component has a reading. Not"
            echo "::error::publishing — the previous key is older but true, and this would be new"
            echo "::error::and empty."
            exit 1
          fi
          echo "measured: $(grep -c '"as_of": "' now.json) component(s)"

      # Multipart form with a `value` field, which is what the KV write API takes.
      #
      # The token carries Workers KV Storage: Edit and nothing else, so it cannot touch Pages, DNS
      # or account settings -- which matters because this repository is public and its secrets are
      # one misconfiguration away from being readable. It is NOT scoped to this namespace, though:
      # Cloudflare's KV permission is account-level and has no per-namespace resource, so a leak of
      # this token is write access to every KV namespace on the account. Worth knowing rather than
      # assuming a tighter blast radius than exists.
      - name: publish to KV
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_NAMESPACE: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$CF_NAMESPACE/values/now" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "value=@now.json" \
            -F 'metadata={}')"
          # The API answers 200 with {"success": false, ...} for some refusals, so the exit code is
          # not the whole story and -f alone would let a failed write look like a good one.
          grep -q '"success":true' <<<"$response" || { echo "::error::$response"; exit 1; }
          echo "published $(wc -c < now.json) bytes"

      # This job watches the ROLLUP, which is a different job on a different schedule.
      #
      # The reason is the outage of 2026-09-12 to 09-14. The rollup's own switch worked perfectly
      # and pinged /fail three nights running; nobody was reading that channel, and the stall was
      # found by a person looking at the page and noticing the bars had stopped. A once-a-night
      # alarm is easy to miss precisely because it arrives once a night. This job runs every
      # fifteen minutes and is the healthiest thing in the repository, so it is the right one to
      # carry the news: a stalled rollup now fails 96 runs a day instead of one.
      #
      # LAST, deliberately, after the harvest and the publish. Failing earlier would stop the
      # snapshot -- taking the page's data down to report that a different job is behind, which is
      # backwards. By here the work is done and all this changes is `job.status`, which sends the
      # ping below to /fail.
      #
      # The expected day is exact rather than a tolerance: yesterday once the 02:30 rollup window
      # has passed, the day before until then. So a single missed run is caught the same morning
      # rather than a day later, and no normal state ever trips it.
      - name: the rollup is still advancing
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, glob, json, sys

          days = set()
          for path in glob.glob("history/*.json"):
              with open(path, encoding="utf-8") as handle:
                  days |= set(json.load(handle).get("days", {}))

          now = dt.datetime.now(dt.timezone.utc)
          # 04:00 rather than 02:30: the rollup starts then and takes a few minutes, and a guard
          # that fires while the job it watches is still running would report its own impatience.
          expected = (now.date() - dt.timedelta(days=1 if now.hour >= 4 else 2)).isoformat()
          newest = max(days) if days else None

          if newest is None:
              print("::error::No day is recorded in history/ at all, so either the rollup has never "
                    "succeeded or the history tree is missing from this checkout.")
              sys.exit(1)
          if newest < expected:
              print(f"::error::The newest rolled-up day is {newest}, and {expected} was due. The "
                    f"nightly rollup has stopped advancing -- check the Rollup workflow. Grafana "
                    f"Cloud drops metrics at 14 days, so every day missing past that is gone "
                    f"permanently; --backfill repairs the rest on the first successful run.")
              sys.exit(1)
          print(f"newest rolled-up day is {newest}, expected at least {expected}")
          PY

      - name: tell the switch how it went
        if: always() && env.NOW_HEALTHCHECK_URL != ''
        env:
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then endpoint="$NOW_HEALTHCHECK_URL"; else endpoint="$NOW_HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$RESULT $RUN_URL" "$endpoint"
